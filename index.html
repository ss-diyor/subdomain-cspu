<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="assets/favicon.png">
<title>Havolalar</title>
<style>
  :root {
    --bg: #ffffff;
    --text: #1a1a1a;
    --muted: #6b6b6b;
    --line: #e4e4e4;
    --hover: #f6f6f6;
    --accent: #1f4fd8;
  }
  :root[data-theme="dark"] {
    --bg: #161616;
    --text: #ececec;
    --muted: #9a9a9a;
    --line: #2e2e2e;
    --hover: #1f1f1f;
    --accent: #7ea2ff;
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }

  .page {
    max-width: 720px;
    margin: 0 auto;
    padding: 56px 24px 96px;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    margin-bottom: 32px;
  }

  h1 {
    margin: 0 0 4px;
    font-size: 28px;
    font-weight: 600;
    letter-spacing: -0.01em;
    line-height: 1.2;
  }

  .subtitle {
    margin: 0;
    color: var(--muted);
  }

  button {
    font: inherit;
    color: inherit;
    background: none;
    border: 0;
    padding: 0;
    cursor: pointer;
  }

  .theme-btn {
    flex: none;
    color: var(--muted);
    font-size: 14px;
    padding: 6px 10px;
    border: 1px solid var(--line);
    border-radius: 4px;
  }
  .theme-btn:hover { color: var(--text); background: var(--hover); }

  .search {
    position: relative;
    margin-bottom: 20px;
  }
  .search svg {
    position: absolute;
    left: 12px;
    top: 50%;
    width: 18px;
    height: 18px;
    transform: translateY(-50%);
    stroke: var(--muted);
    fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
    pointer-events: none;
  }
  .search input {
    width: 100%;
    font: inherit;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 11px 12px 11px 40px;
  }
  .search input::placeholder { color: var(--muted); }
  .search input:focus { outline: none; border-color: var(--accent); }

  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 20px;
    margin-bottom: 36px;
    border-bottom: 1px solid var(--line);
  }
  .filters button {
    color: var(--muted);
    font-size: 15px;
    padding: 8px 0;
    margin-bottom: -1px;
    border-bottom: 2px solid transparent;
  }
  .filters button:hover { color: var(--text); }
  .filters button[aria-pressed="true"] {
    color: var(--text);
    border-bottom-color: var(--text);
    font-weight: 600;
  }

  section { margin-bottom: 40px; }

  h2 {
    margin: 0 0 4px;
    font-size: 18px;
    font-weight: 600;
  }

  ul { list-style: none; margin: 0; padding: 0; }

  li { border-bottom: 1px solid var(--line); }
  li:first-child { border-top: 1px solid var(--line); }

  a.item {
    display: block;
    padding: 14px 8px;
    margin: 0 -8px;
    color: inherit;
    text-decoration: none;
    border-radius: 4px;
  }
  a.item:hover { background: var(--hover); }
  a.item:hover .name { color: var(--accent); }

  .row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 16px;
  }
  .name { font-weight: 500; }
  .host {
    flex: none;
    color: var(--muted);
    font-size: 13px;
  }
  .desc {
    margin: 2px 0 0;
    color: var(--muted);
    font-size: 14px;
  }

  .empty {
    color: var(--muted);
    padding: 24px 0;
  }

  a:focus-visible, button:focus-visible, input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  @media (max-width: 520px) {
    .page { padding: 32px 16px 64px; }
    h1 { font-size: 24px; }
    .row { flex-direction: column; gap: 0; }
  }
</style>
</head>
<body>

<div class="page">
  <header>
    <div>
      <h1 id="siteTitle"></h1>
      <p class="subtitle" id="siteSubtitle"></p>
    </div>
    <button class="theme-btn" id="themeBtn" type="button"></button>
  </header>

  <div class="search">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
    <input id="q" type="search" placeholder="Qidirish" aria-label="Havolalar ichidan qidirish" autocomplete="off">
  </div>

  <nav class="filters" id="filters" aria-label="Bo‘limlar"></nav>

  <main id="list"></main>
</div>

<script>
/* =====================================================================
   SOZLAMALAR — faqat shu qismni tahrirlang
   ===================================================================== */

var SITE = {
  title: "Havolalar",
  subtitle: "Kerakli material, test va resurslarni shu yerdan toping."
};

/*
  Har bir havola uchun:
    title    — nomi
    url      — havola manzili (https:// bilan)
    category — bo‘lim nomi (bir xil yozilsa, bitta bo‘limga tushadi)
    desc     — qisqa izoh (ixtiyoriy, bo‘sh qoldirish mumkin)

  Yangi havola qo‘shish uchun pastdagi bir qatorni nusxalab, o‘zgartiring.
  Oxirgi qatordan tashqari har bir qator oxirida vergul bo‘lishi shart.
*/

var LINKS = [
  { title: "Mediasavodxonlik va axborot madaniyati",  url: "https://ss-diyor.github.io/media-literacy-midterm/", category: "Midterm" },
  { title: "Umumiy psixologiya",   url: "https://ss-diyor.github.io/general-psychology-midterm/",     category: "Midterm" },
  { title: "Til aspektlari amaliyoti",  url: "https://ss-diyor.github.io/taa-final/",   category: "Final" },
  { title: "Nutq ko'nikmalari integratsiyasi", url: "https://ss-diyor.github.io/nki-final",      category: "Final" },
  { title: "Telegram kanal",         url: "https://t.me/turizm_rasmiy_kanal",      category: "Aloqa",         desc: "Turizm fakultetining kanali." }
];

/* ===================================================================== */

(function () {
  var ALL = "Barchasi";
  var state = { query: "", category: ALL };

  var elList = document.getElementById("list");
  var elFilters = document.getElementById("filters");
  var elQ = document.getElementById("q");
  var elTheme = document.getElementById("themeBtn");

  document.getElementById("siteTitle").textContent = SITE.title;
  document.getElementById("siteSubtitle").textContent = SITE.subtitle;
  document.title = SITE.title;

  /* ---- Mavzu (yorug‘ / qorong‘i) ---- */
  function systemTheme() {
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  function applyTheme(t) {
    document.documentElement.setAttribute("data-theme", t);
    elTheme.textContent = t === "dark" ? "Yorug‘ rejim" : "Qorong‘i rejim";
  }
  var theme = systemTheme();
  try { theme = localStorage.getItem("theme") || theme; } catch (e) {}
  applyTheme(theme);
  elTheme.addEventListener("click", function () {
    theme = theme === "dark" ? "light" : "dark";
    applyTheme(theme);
    try { localStorage.setItem("theme", theme); } catch (e) {}
  });

  /* ---- Yordamchi funksiyalar ---- */
  function host(url) {
    try { return new URL(url).hostname.replace(/^www\./, ""); } catch (e) { return ""; }
  }

  function categories() {
    var seen = [];
    LINKS.forEach(function (l) {
      if (seen.indexOf(l.category) === -1) seen.push(l.category);
    });
    return seen;
  }

  function matches(l) {
    if (state.category !== ALL && l.category !== state.category) return false;
    var q = state.query.trim().toLowerCase();
    if (!q) return true;
    return (l.title + " " + (l.desc || "") + " " + l.category + " " + host(l.url))
      .toLowerCase().indexOf(q) !== -1;
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }

  /* ---- Bo‘limlar tugmalari ---- */
  function renderFilters() {
    elFilters.textContent = "";
    [ALL].concat(categories()).forEach(function (c) {
      var b = el("button", "", c);
      b.type = "button";
      b.setAttribute("aria-pressed", String(state.category === c));
      b.addEventListener("click", function () {
        state.category = c;
        renderFilters();
        renderList();
      });
      elFilters.appendChild(b);
    });
  }

  /* ---- Ro‘yxat ---- */
  function renderList() {
    elList.textContent = "";
    var shown = LINKS.filter(matches);

    if (!shown.length) {
      elList.appendChild(el("p", "empty", "Hech narsa topilmadi. Boshqa so‘z bilan qidirib ko‘ring."));
      return;
    }

    categories().forEach(function (cat) {
      var group = shown.filter(function (l) { return l.category === cat; });
      if (!group.length) return;

      var sec = el("section");
      sec.appendChild(el("h2", "", cat));
      var ul = el("ul");

      group.forEach(function (l) {
        var li = el("li");
        var a = el("a", "item");
        a.href = l.url;
        a.target = "_blank";
        a.rel = "noopener noreferrer";

        var row = el("div", "row");
        row.appendChild(el("span", "name", l.title));
        var h = host(l.url);
        if (h) row.appendChild(el("span", "host", h));
        a.appendChild(row);

        if (l.desc) a.appendChild(el("p", "desc", l.desc));

        li.appendChild(a);
        ul.appendChild(li);
      });

      sec.appendChild(ul);
      elList.appendChild(sec);
    });
  }

  elQ.addEventListener("input", function () {
    state.query = elQ.value;
    renderList();
  });

  renderFilters();
  renderList();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="icon" type="image/png" href="assets/favicon.png">
<title>Havolalar</title>
<script>
  (function () {
    try {
      var saved = localStorage.getItem("theme");
      var pref = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", saved || pref);
    } catch (e) {}
  })();
</script>
<style>
  :root {
    --bg: #fafafa;
    --surface: #ffffff;
    --surface-hover: #f5f7fb;
    --text: #111827;
    --text-secondary: #4b5563;
    --muted: #6b7280;
    --border: #e5e7eb;
    --border-strong: #d1d5db;
    --accent: #1d4ed8;
    --accent-soft: rgba(29, 78, 216, 0.08);
    --pill-active-bg: #111827;
    --pill-active-text: #ffffff;
    --notice-bg: #fffbeb;
    --notice-border: #fde68a;
    --notice-text: #92400e;
    --notice-icon: #d97706;
    --shadow-xs: 0 1px 2px rgba(17, 24, 39, 0.04);
    --radius-sm: 8px;
    --radius-md: 12px;
  }

  :root[data-theme="dark"] {
    --bg: #0c0e12;
    --surface: #13161c;
    --surface-hover: #191d26;
    --text: #f3f4f6;
    --text-secondary: #a1a8b5;
    --muted: #858d9c;
    --border: #222631;
    --border-strong: #323847;
    --accent: #60a5fa;
    --accent-soft: rgba(96, 165, 250, 0.14);
    --pill-active-bg: #f3f4f6;
    --pill-active-text: #0c0e12;
    --notice-bg: #1a150c;
    --notice-border: #3d2e14;
    --notice-text: #f3c979;
    --notice-icon: #f59e0b;
    --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.25);
  }

  *, *::before, *::after {
    box-sizing: border-box;
  }

  html {
    -webkit-text-size-adjust: 100%;
    font-feature-settings: "cv02", "cv03", "cv04", "cv11";
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    transition: background-color 0.2s ease, color 0.2s ease;
  }

  .page {
    max-width: 680px;
    margin: 0 auto;
    padding: 56px 24px 80px;
  }

  /* ---- Header ---- */
  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    margin-bottom: 28px;
  }

  .brand {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    min-width: 0;
  }

  .brand-logo {
    width: 38px;
    height: 38px;
    flex: none;
    object-fit: contain;
    margin-top: 2px;
  }

  h1 {
    margin: 0 0 4px;
    font-size: 24px;
    font-weight: 600;
    letter-spacing: -0.025em;
    line-height: 1.2;
  }

  .subtitle {
    margin: 0;
    color: var(--muted);
    font-size: 14.5px;
    line-height: 1.5;
  }

  button {
    font: inherit;
    color: inherit;
    background: none;
    border: 0;
    padding: 0;
    cursor: pointer;
  }

  .theme-btn {
    flex: none;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    height: 34px;
    padding: 0 11px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    box-shadow: var(--shadow-xs);
    transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }

  .theme-btn:hover {
    color: var(--text);
    border-color: var(--border-strong);
    background: var(--surface-hover);
  }

  .theme-btn svg {
    width: 15px;
    height: 15px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* ---- Search ---- */
  .search {
    position: relative;
    margin-bottom: 16px;
  }

  .search-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    width: 17px;
    height: 17px;
    transform: translateY(-50%);
    stroke: var(--muted);
    fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
    pointer-events: none;
    transition: stroke 0.15s ease;
  }

  .search input {
    width: 100%;
    height: 44px;
    font: inherit;
    font-size: 14.5px;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 0 42px 0 42px;
    box-shadow: var(--shadow-xs);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
    -webkit-appearance: none;
    appearance: none;
  }

  .search input::-webkit-search-cancel-button {
    -webkit-appearance: none;
    appearance: none;
  }

  .search input::placeholder {
    color: var(--muted);
  }

  .search input:hover {
    border-color: var(--border-strong);
  }

  .search input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .search:focus-within .search-icon {
    stroke: var(--accent);
  }

  .search-kbd {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 22px;
    height: 22px;
    padding: 0 6px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 11px;
    color: var(--muted);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 5px;
    pointer-events: none;
    transition: opacity 0.15s ease;
  }

  .search:focus-within .search-kbd,
  .search.has-value .search-kbd {
    opacity: 0;
  }

  .search-clear {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    display: none;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    border-radius: 6px;
    color: var(--muted);
    transition: background-color 0.15s ease, color 0.15s ease;
  }

  .search.has-value .search-clear {
    display: inline-flex;
  }

  .search-clear:hover {
    color: var(--text);
    background: var(--surface-hover);
  }

  .search-clear svg {
    width: 15px;
    height: 15px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
  }

  /* ---- Notice ---- */
  .notice {
    display: flex;
    align-items: flex-start;
    gap: 11px;
    margin: 0 0 24px;
    padding: 12px 14px;
    color: var(--notice-text);
    background: var(--notice-bg);
    border: 1px solid var(--notice-border);
    border-radius: var(--radius-sm);
    font-size: 13.5px;
    line-height: 1.5;
  }

  .notice[hidden] {
    display: none;
  }

  .notice-icon {
    flex: none;
    width: 18px;
    height: 18px;
    margin-top: 1px;
    fill: none;
    stroke: var(--notice-icon);
    stroke-width: 1.9;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* ---- Category Filters ---- */
  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 28px;
  }

  .filter-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 32px;
    padding: 0 12px;
    font-size: 13.5px;
    font-weight: 500;
    color: var(--text-secondary);
    background: transparent;
    border: 1px solid transparent;
    border-radius: 999px;
    transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }

  .filter-btn:hover {
    color: var(--text);
    background: var(--surface);
    border-color: var(--border);
  }

  .filter-btn[aria-pressed="true"] {
    color: var(--pill-active-text);
    background: var(--pill-active-bg);
    border-color: var(--pill-active-bg);
  }

  .filter-count {
    font-size: 11.5px;
    font-variant-numeric: tabular-nums;
    opacity: 0.65;
  }

  /* ---- Link Sections ---- */
  section {
    margin-bottom: 28px;
  }

  section:last-child {
    margin-bottom: 0;
  }

  .section-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 0 2px 8px;
  }

  h2 {
    margin: 0;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .section-count {
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
  }

  ul {
    list-style: none;
    margin: 0;
    padding: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-xs);
    overflow: hidden;
  }

  li + li {
    border-top: 1px solid var(--border);
  }

  a.item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    padding: 15px 18px;
    color: inherit;
    text-decoration: none;
    transition: background-color 0.15s ease;
  }

  a.item:hover {
    background: var(--surface-hover);
  }

  .item-body {
    min-width: 0;
  }

  .name {
    display: block;
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    letter-spacing: -0.005em;
    transition: color 0.15s ease;
  }

  a.item:hover .name {
    color: var(--accent);
  }

  .desc {
    margin: 3px 0 0;
    color: var(--muted);
    font-size: 13.5px;
    line-height: 1.45;
  }

  .item-meta {
    flex: none;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--muted);
  }

  .host {
    font-size: 12.5px;
    color: var(--muted);
    white-space: nowrap;
  }

  .arrow {
    width: 15px;
    height: 15px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: 0.55;
    transition: transform 0.15s ease, color 0.15s ease, opacity 0.15s ease;
  }

  a.item:hover .arrow {
    color: var(--accent);
    opacity: 1;
    transform: translate(2px, -2px);
  }

  /* ---- Empty State ---- */
  .empty {
    text-align: center;
    padding: 44px 24px;
    background: var(--surface);
    border: 1px dashed var(--border-strong);
    border-radius: var(--radius-md);
    color: var(--muted);
  }

  .empty p {
    margin: 0 0 14px;
    font-size: 14.5px;
  }

  .empty-reset {
    display: inline-flex;
    align-items: center;
    height: 32px;
    padding: 0 14px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    transition: border-color 0.15s ease, background-color 0.15s ease;
  }

  .empty-reset:hover {
    border-color: var(--border-strong);
    background: var(--surface-hover);
  }

  /* ---- Footer ---- */
  footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 40px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    font-size: 12.5px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  /* ---- Focus & Motion ---- */
  a:focus-visible,
  button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      transition: none !important;
    }
  }

  /* ---- Mobile ---- */
  @media (max-width: 540px) {
    .page {
      padding: 32px 16px 64px;
    }

    header {
      margin-bottom: 22px;
    }

    .brand-logo {
      width: 32px;
      height: 32px;
    }

    h1 {
      font-size: 21px;
    }

    .theme-btn .theme-label {
      display: none;
    }

    .theme-btn {
      width: 34px;
      padding: 0;
      justify-content: center;
    }

    a.item {
      padding: 14px 15px;
      align-items: flex-start;
    }

    .host {
      display: none;
    }

    .arrow {
      margin-top: 3px;
    }

    .search-kbd {
      display: none;
    }
  }
</style>
</head>
<body>

<div class="page">
  <header>
    <div class="brand">
      <img class="brand-logo" src="assets/favicon.png" alt="" width="38" height="38" onerror="this.style.display='none'">
      <div>
        <h1 id="siteTitle"></h1>
        <p class="subtitle" id="siteSubtitle"></p>
      </div>
    </div>
    <button class="theme-btn" id="themeBtn" type="button" aria-label="Mavzuni almashtirish">
      <svg id="themeIcon" viewBox="0 0 24 24" aria-hidden="true"></svg>
      <span class="theme-label" id="themeLabel"></span>
    </button>
  </header>

  <div class="search" id="searchBox">
    <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="11" cy="11" r="7"></circle>
      <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
    </svg>
    <input id="q" type="search" placeholder="Havolalar ichidan qidirish..." aria-label="Havolalar ichidan qidirish" autocomplete="off">
    <span class="search-kbd" aria-hidden="true">/</span>
    <button class="search-clear" id="clearBtn" type="button" aria-label="Qidiruvni tozalash">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>

  <aside class="notice" id="siteNotice" role="note">
    <svg class="notice-icon" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="9.5"></circle>
      <line x1="12" y1="8" x2="12" y2="12.5"></line>
      <circle cx="12" cy="16" r="0.8" fill="currentColor" stroke="none"></circle>
    </svg>
    <span id="siteNoticeText"></span>
  </aside>

  <nav class="filters" id="filters" aria-label="Bo‘limlar"></nav>

  <main id="list" aria-live="polite"></main>

  <footer>
    <span id="statusText"></span>
  </footer>
</div>

<script>
/* =====================================================================
   SOZLAMALAR — faqat shu qismni tahrirlang
   ===================================================================== */

var SITE = {
  title: "Havolalar",
  subtitle: "Kerakli material, test va resurslarni shu yerdan toping.",
  notice: "Ushbu havolalardagi javob variantlarining 100 % to‘g‘riligi kafolatlanmaydi. Ustozingiz bilan maslahatlashishingiz tavsiya etiladi."
};

/*
  Har bir havola uchun:
    title    — nomi
    url      — havola manzili (https:// bilan)
    category — bo‘lim nomi (bir xil yozilsa, bitta bo‘limga tushadi)
    desc     — qisqa izoh (ixtiyoriy, bo‘sh qoldirish mumkin)

  Yangi havola qo‘shish uchun pastdagi bir qatorni nusxalab, o‘zgartiring.
  Oxirgi qatordan tashqari har bir qator oxirida vergul bo‘lishi shart.
*/

var LINKS = [
  { title: "Mediasavodxonlik va axborot madaniyati", url: "https://ss-diyor.github.io/media-literacy-midterm/", category: "Oraliq" },
  { title: "Umumiy psixologiya",                     url: "https://ss-diyor.github.io/general-psychology-midterm/", category: "Oraliq" },
  { title: "Til aspektlari amaliyoti",               url: "https://ss-diyor.github.io/taa-final/", category: "Yakuniy" },
  { title: "Nutq ko'nikmalari integratsiyasi",       url: "https://ss-diyor.github.io/nki-final", category: "Yakuniy" },
  { title: "Amaliy rus tili",                        url: "https://ss-diyor.github.io/practical-russian-language-final/", category: "Yakuniy" },
  { title: "Bog'lanish",                             url: "https://t.me/m/0crrXIvMZTdi", category: "Aloqa", desc: "Yaratuvchi bilan bog'lanish." },
  { title: "Telegram kanal",                         url: "https://t.me/turizm_rasmiy_kanal", category: "Aloqa", desc: "Turizm fakultetining kanali." }
];

/* ===================================================================== */

(function () {
  var ALL = "Barchasi";
  var state = { query: "", category: ALL };

  var elList = document.getElementById("list");
  var elFilters = document.getElementById("filters");
  var elQ = document.getElementById("q");
  var elSearchBox = document.getElementById("searchBox");
  var elClearBtn = document.getElementById("clearBtn");
  var elTheme = document.getElementById("themeBtn");
  var elThemeIcon = document.getElementById("themeIcon");
  var elThemeLabel = document.getElementById("themeLabel");
  var elNotice = document.getElementById("siteNotice");
  var elNoticeText = document.getElementById("siteNoticeText");
  var elStatus = document.getElementById("statusText");

  document.getElementById("siteTitle").textContent = SITE.title;
  document.getElementById("siteSubtitle").textContent = SITE.subtitle;
  document.title = SITE.title;

  if (SITE.notice && SITE.notice.trim()) {
    elNoticeText.textContent = SITE.notice;
  } else {
    elNotice.hidden = true;
  }

  /* ---- Mavzu (yorug‘ / qorong‘i) ---- */
  var SUN_SVG = '<circle cx="12" cy="12" r="4"></circle>' +
    '<line x1="12" y1="2" x2="12" y2="5"></line>' +
    '<line x1="12" y1="19" x2="12" y2="22"></line>' +
    '<line x1="4.93" y1="4.93" x2="7.05" y2="7.05"></line>' +
    '<line x1="16.95" y1="16.95" x2="19.07" y2="19.07"></line>' +
    '<line x1="2" y1="12" x2="5" y2="12"></line>' +
    '<line x1="19" y1="12" x2="22" y2="12"></line>' +
    '<line x1="4.93" y1="19.07" x2="7.05" y2="16.95"></line>' +
    '<line x1="16.95" y1="7.05" x2="19.07" y2="4.93"></line>';

  var MOON_SVG = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';

  function currentTheme() {
    return document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
  }

  function applyTheme(t) {
    document.documentElement.setAttribute("data-theme", t);
    elThemeIcon.innerHTML = t === "dark" ? SUN_SVG : MOON_SVG;
    elThemeLabel.textContent = t === "dark" ? "Yorug‘" : "Qorong‘i";
    elTheme.setAttribute("aria-label", t === "dark" ? "Yorug‘ rejimga o‘tish" : "Qorong‘i rejimga o‘tish");
  }

  applyTheme(currentTheme());

  elTheme.addEventListener("click", function () {
    var next = currentTheme() === "dark" ? "light" : "dark";
    applyTheme(next);
    try { localStorage.setItem("theme", next); } catch (e) {}
  });

  /* ---- Yordamchi funksiyalar ---- */
  function host(url) {
    try { return new URL(url).hostname.replace(/^www\./, ""); } catch (e) { return ""; }
  }

  function categories() {
    var seen = [];
    LINKS.forEach(function (l) {
      if (seen.indexOf(l.category) === -1) seen.push(l.category);
    });
    return seen;
  }

  function matchesQuery(l) {
    var q = state.query.trim().toLowerCase();
    if (!q) return true;
    return (l.title + " " + (l.desc || "") + " " + l.category + " " + host(l.url))
      .toLowerCase().indexOf(q) !== -1;
  }

  function matches(l) {
    if (state.category !== ALL && l.category !== state.category) return false;
    return matchesQuery(l);
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }

  function arrowSvg() {
    var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("class", "arrow");
    svg.setAttribute("viewBox", "0 0 24 24");
    svg.setAttribute("aria-hidden", "true");
    svg.innerHTML = '<line x1="7" y1="17" x2="17" y2="7"></line><polyline points="7 7 17 7 17 17"></polyline>';
    return svg;
  }

  /* ---- Bo‘limlar tugmalari ---- */
  function renderFilters() {
    elFilters.textContent = "";
    var queryMatched = LINKS.filter(matchesQuery);

    [ALL].concat(categories()).forEach(function (c) {
      var count = c === ALL
        ? queryMatched.length
        : queryMatched.filter(function (l) { return l.category === c; }).length;

      var b = el("button", "filter-btn");
      b.type = "button";
      b.setAttribute("aria-pressed", String(state.category === c));
      b.appendChild(el("span", "", c));
      b.appendChild(el("span", "filter-count", String(count)));

      b.addEventListener("click", function () {
        state.category = c;
        renderFilters();
        renderList();
      });
      elFilters.appendChild(b);
    });
  }

  /* ---- Ro‘yxat ---- */
  function renderList() {
    elList.textContent = "";
    var shown = LINKS.filter(matches);

    if (shown.length === LINKS.length) {
      elStatus.textContent = LINKS.length + " ta havola";
    } else {
      elStatus.textContent = shown.length + " / " + LINKS.length + " ta havola";
    }

    if (!shown.length) {
      var box = el("div", "empty");
      box.appendChild(el("p", "", "Hech narsa topilmadi. Boshqa so‘z bilan qidirib ko‘ring."));
      var resetBtn = el("button", "empty-reset", "Filterni tozalash");
      resetBtn.type = "button";
      resetBtn.addEventListener("click", function () {
        state.query = "";
        state.category = ALL;
        elQ.value = "";
        elSearchBox.classList.remove("has-value");
        renderFilters();
        renderList();
        elQ.focus();
      });
      box.appendChild(resetBtn);
      elList.appendChild(box);
      return;
    }

    categories().forEach(function (cat) {
      var group = shown.filter(function (l) { return l.category === cat; });
      if (!group.length) return;

      var sec = el("section");
      var head = el("div", "section-head");
      head.appendChild(el("h2", "", cat));
      head.appendChild(el("span", "section-count", String(group.length)));
      sec.appendChild(head);

      var ul = el("ul");

      group.forEach(function (l) {
        var li = el("li");
        var a = el("a", "item");
        a.href = l.url;
        a.target = "_blank";
        a.rel = "noopener noreferrer";

        var body = el("div", "item-body");
        body.appendChild(el("span", "name", l.title));
        if (l.desc) body.appendChild(el("p", "desc", l.desc));
        a.appendChild(body);

        var meta = el("div", "item-meta");
        var h = host(l.url);
        if (h) meta.appendChild(el("span", "host", h));
        meta.appendChild(arrowSvg());
        a.appendChild(meta);

        li.appendChild(a);
        ul.appendChild(li);
      });

      sec.appendChild(ul);
      elList.appendChild(sec);
    });
  }

  /* ---- Qidiruv va klaviatura ---- */
  function syncSearch() {
    state.query = elQ.value;
    elSearchBox.classList.toggle("has-value", Boolean(elQ.value));
    renderFilters();
    renderList();
  }

  elQ.addEventListener("input", syncSearch);

  elClearBtn.addEventListener("click", function () {
    elQ.value = "";
    syncSearch();
    elQ.focus();
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "/" && document.activeElement !== elQ && !e.ctrlKey && !e.metaKey && !e.altKey) {
      var tag = (document.activeElement && document.activeElement.tagName) || "";
      if (tag !== "INPUT" && tag !== "TEXTAREA") {
        e.preventDefault();
        elQ.focus();
      }
    } else if (e.key === "Escape" && document.activeElement === elQ) {
      if (elQ.value) {
        elQ.value = "";
        syncSearch();
      } else {
        elQ.blur();
      }
    }
  });

  renderFilters();
  renderList();
})();
</script>
</body>
</html>
